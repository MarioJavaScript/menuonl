name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions:  mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl, gd, fileinfo, zip
        coverage: none

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Execute Tests
      env:
        APP_KEY: base64:zTXE842dAjTvLSYC0JlPBcqLedGFCENE7FWHBeLjbxA=
      run: php artisan test

    - name: Composer Audit
      run: composer audit

  tests-mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: menuonl_test
          MARIADB_USER: menuonl_ci
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # Variables set here take precedence over the <env> entries in phpunit.xml (none uses force="true").
    env:
      APP_KEY: base64:zTXE842dAjTvLSYC0JlPBcqLedGFCENE7FWHBeLjbxA=
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: menuonl_test
      DB_USERNAME: menuonl_ci
      DB_PASSWORD: ci-only-password

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions:  mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, curl, gd, fileinfo, zip
        coverage: none

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # .env vacío: solo evita el aviso de phpdotenv por archivo inexistente; no define configuración.
    - name: Prepare Environment File
      run: touch .env

    - name: Run Migrations (validates CHECK constraints on MariaDB)
      run: php artisan migrate:fresh --force

    - name: Execute Tests on MariaDB
      run: php artisan test --compact
