; Worker de colas de Menuonl para Supervisor (ver deploy/README.md).
; Copiar a /etc/supervisor/conf.d/menuonl-worker.conf, ajustar las rutas y el usuario, y ejecutar:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start menuonl-worker:*
;
; --tries      : reintentos de los trabajos que no definen los suyos (EnviarInvitacionJob define 4 con espera creciente).
; --timeout    : segundos máximos por trabajo; debe ser MENOR que DB_QUEUE_RETRY_AFTER (90 por defecto).
; --max-time   : el proceso termina solo cada hora y Supervisor lo vuelve a levantar (libera memoria).
; stopwaitsecs : debe ser mayor que --timeout para que un reinicio no corte un trabajo a la mitad.
[program:menuonl-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/menuonl/artisan queue:work --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/var/www/menuonl
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/menuonl/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
